name: Generate C/C++ unit tests (UTBot)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up toolchain
        # adjust if your project needs a specific gcc/clang version
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm

      - name: Run UTBot action to generate tests
        uses: UnitTestBot/UTBotCpp-action@v1
        with:
          # example inputs — check the action repo README for exact options
          github_token: ${{ secrets.GIT_TOKEN }}
          build_command: "cmake --build build"  # CMake build command
          test_dir: "tests"                   # where UTBot should write tests
          generate_for_changed_files: "true"  # if supported, only run on changed files

      - name: Commit and push generated tests (if action didn't auto-push)
        # Many UTBot actions can push directly; only needed if you're producing files locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests || true
          git commit -m "chore(tests): add autogenerated tests (UTBot)" || echo "no changes to commit"
          git push origin HEAD:${{ github.head_ref }} || echo "could not push"